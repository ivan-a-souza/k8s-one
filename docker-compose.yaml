services:
  k8s:
    build:
      context: .
      network: host
    image: k8s-one:latest
    container_name: k8s-one
    hostname: k8s-one
    privileged: true
    cgroup: host
    environment:
      # rbd-nbd orphan reaper: 1 = dry-run (default, só loga), 0 = desmapeia.
      RBD_REAPER_DRY_RUN: "${RBD_REAPER_DRY_RUN:-1}"
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys:/sys:rw
      - /lib/modules:/lib/modules:ro
      - ./data/etcd:/var/lib/etcd
      - ./data/containerd:/var/lib/containerd
      - ./data/kubelet:/var/lib/kubelet
      - ./data/pki:/etc/kubernetes/pki
      - ./data/kubernetes:/etc/kubernetes
      - ./data/rook:/var/lib/rook
      - ./data/tiles:/var/lib/tiles
      - ./manifests/built-in:/opt/manifests/built-in:ro
      - ./manifests/apps:/opt/manifests/apps:ro
    ports:
      - "127.0.0.1:6443:6443"
      - "100.67.186.94:6443:6443"
      - "100.67.186.94:8082:30080"
      - "100.67.186.94:8443:30443"
    restart: unless-stopped
