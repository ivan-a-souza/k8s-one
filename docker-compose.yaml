services:
  k8s:
    build:
      context: .
      network: host
    image: k8s-one:latest
    container_name: k8s-one
    hostname: k8s-one
    privileged: true
    cgroup: host
    # Teto de memória do CONTAINER (control plane + runtime + cache). Os PODS
    # NÃO entram aqui: eles têm teto próprio no cgroup irmão `kubepods`
    # (memory.max ~9,4GiB, via enforceNodeAllocatable no kubelet).
    # `memswap_limit == mem_limit` => `memory.swap.max=0` no cgroup do container:
    # o control plane não empurra o host para swap. Os 6g são folga larga sobre
    # o uso real (~1,9GiB) para não OOMar o runtime/página de cache.
    mem_limit: 6g
    memswap_limit: 6g
    environment:
      ARGOCD_VERSION: "${ARGOCD_VERSION:-v3.5.1}"
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys:/sys:rw
      - /lib/modules:/lib/modules:ro
      - ./data/etcd:/var/lib/etcd
      - ./data/containerd:/var/lib/containerd
      - ./data/kubelet:/var/lib/kubelet
      - ./data/pki:/etc/kubernetes/pki
      - ./data/kubernetes:/etc/kubernetes
      # local-path-provisioner: volumes provisionados vivem aqui. SEM este bind
      # mount, recriar o container apaga os PVs (o path fica na camada gravável
      # efêmera do container). É o StorageClass default do cluster.
      - ./data/local-path:/opt/local-path-provisioner
      - ./data/tiles:/var/lib/tiles
      - ./manifests/built-in:/opt/manifests/built-in:ro
      - ./manifests/apps:/opt/manifests/apps:ro
      - ./manifests/networking:/opt/manifests/networking:ro
      - ./manifests/ops:/opt/manifests/ops:ro
      - ./manifests/data:/opt/manifests/data:ro
      - ./manifests/platform:/opt/manifests/platform:ro
    ports:
      # 127.0.0.1:6443 removida — 0.0.0.0:6443 abaixo já cobre loopback
      - "0.0.0.0:6443:6443"
      - "0.0.0.0:53:53/tcp"
      - "0.0.0.0:53:53/udp"
      - "0.0.0.0:3000:3000"
      - "0.0.0.0:80:30080"
      - "0.0.0.0:443:30443"
      - "0.0.0.0:30080:30080"
      - "0.0.0.0:30443:30443"
      - "0.0.0.0:8082:30080"
      - "0.0.0.0:8443:30443"
      # PostgreSQL do cluster (Service `postgres` no ns data, NodePort 30432).
      # Loopback, e NÃO 0.0.0.0 como as outras: as demais portas têm que existir
      # para a LAN alcançar o host, mas o banco não deve sair dele. O caminho
      # LAN/tailnet continua sendo dentro do cluster, via Service.
      - "127.0.0.1:5432:30432"
    restart: unless-stopped
    # Grace period for the ordered shutdown (PID 1 lets the kubelet terminate
    # PVC consumers — postgres/vaultwarden — before stopping containerd).
    stop_grace_period: 5m
    networks:
      default:
        ipv4_address: 192.168.32.2

networks:
  default:
    ipam:
      config:
        - subnet: 192.168.32.0/20
          gateway: 192.168.32.1
