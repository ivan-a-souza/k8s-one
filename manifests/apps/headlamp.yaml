# Headlamp — dashboard do Kubernetes (in-cluster, basic auth no ingress)
# Acesso: https://headlamp.naesquina.com.br (login via token do SA headlamp-admin)
# Login HTTP: admin / k8s-dashboard-2026 (basic auth do HAProxy ingress)

---
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: headlamp
---
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-basic-auth
  namespace: headlamp
type: Opaque
stringData:
  # chave = usuário, valor = hash bcrypt (formato esperado pelo HAProxy ingress)
  admin: $2y$05$yBi7S1Ts3J0lDP8uMVElc.Zo.cjjJurSukqn1v6yhfmjxXsOcnjyK
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      serviceAccountName: headlamp-admin
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:latest
          args: ["--in-cluster"]
          ports:
            - containerPort: 4466
          resources:
            limits:
              memory: 256Mi
              cpu: "0.5"
            requests:
              memory: 128Mi
              cpu: "0.1"
          readinessProbe:
            httpGet:
              path: /
              port: 4466
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app: headlamp
spec:
  selector:
    app: headlamp
  ports:
    - name: http
      port: 80
      targetPort: 4466
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    haproxy.org/ingress.class: haproxy
    haproxy.org/auth-type: basic-auth
    haproxy.org/auth-userlist: users
    haproxy.org/auth-secret: headlamp-basic-auth
spec:
  rules:
    - host: headlamp.naesquina.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
