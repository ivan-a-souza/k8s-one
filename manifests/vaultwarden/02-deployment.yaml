# Vaultwarden — Deployment.
#
# Mesmo serviço que rodava no docker-compose do infra (vaultwarden/server),
# agora no cluster.
#
# IMAGEM: build `testing` (master) PINADA por digest. Os clientes Bitwarden
# 2026.9.0 (CLI e extensão, que auto-atualiza) rodam no login um "Encrypted
# Migrator" que faz POST /api/accounts/key-management/user-key-id; o 1.37.3
# (última release) NÃO tem essa rota -> 404 -> o migrator aborta e o cofre não
# carrega (spinner no web e na extensão). O PR #7693 corrige isso e já está no
# master (build testing de 25/09). Voltar para a tag estável quando sair 1.37.4.
# Upstream: dani-garcia/vaultwarden#7750.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
  labels:
    app: vaultwarden
spec:
  replicas: 1
  # Recreate: o volume é ReadWriteOnce (SQLite). Num nó único, um RollingUpdate
  # com maxSurge tentaria subir 2 pods disputando o mesmo PVC.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server@sha256:19d37163b917f46a69fab8570ce6e2028524de3f77eda6fbcec3aa7cbefc88b4
          imagePullPolicy: IfNotPresent
          envFrom:
            # ADMIN_TOKEN, SIGNUPS_ALLOWED, DOMAIN, ROCKET_PORT.
            # Fora do git: criado por scripts/create-secrets.sh (gitignored).
            - secretRef:
                name: vaultwarden-env
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          # /alive é barato (não toca banco); /health faz round-trip no DB.
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            # Timeouts com folga: o nó compartilha CPU com o desktop inteiro
            # (mesmo motivo dos probes do LiteLLM).
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
