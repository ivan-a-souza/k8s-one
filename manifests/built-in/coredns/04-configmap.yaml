apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        prometheus :9153
        # Nomes .lan dos servicos do cluster. O `forward` abaixo vai direto para
        # 8.8.8.8/1.1.1.1, que nao conhecem .lan (TLD privado, so o AdGuard
        # resolve) — sem este bloco nenhum pod fala com authentik.lan,
        # grafana.lan etc. pelo nome, so por ClusterIP.
        #
        # O IP e o VIP do MetalLB (service LoadBalancer do haproxy-ingress), e
        # NAO o 192.168.1.20 dos rewrites do AdGuard: .20 e o IP da LAN do host
        # e nao e alcancavel de dentro do cluster (timeout). O VIP e, roteia por
        # Host header e serve os certs mkcert normalmente.
        #
        # Lista explicita em vez de curinga: o plugin `hosts` so ganhou suporte
        # a wildcard no master do CoreDNS (nenhum release; aqui roda v1.12.0), e
        # a alternativa (`template`) faria TODO *.lan responder o VIP —
        # inclusive router.lan, que no AdGuard aponta para 192.168.1.1. Servico
        # .lan novo = uma palavra a mais nesta linha.
        hosts {
            192.168.1.200 argocd.lan authentik.lan ceph.lan dns.lan grafana.lan headlamp.lan litellm.lan vault.lan
            ttl 30
            no_reverse
            fallthrough
        }
        forward . 8.8.8.8 1.1.1.1 {
            max_concurrent 1000
        }
        cache 30
        loop
        reload
        loadbalance
    }
