# Merge patch do argocd-cm: OIDC/SSO pelo Authentik. Aplicado pelo entrypoint
# a cada boot (o Argo CD e instalado a partir do install.yaml upstream, que
# recria o argocd-cm). Ver scripts/entrypoint.sh.
#
# `clientSecret` referencia o Secret argocd-oidc (ns argocd, label
# app.kubernetes.io/part-of: argocd) — o segredo NUNCA fica neste arquivo.
# `rootCA` e o certificado PUBLICO da raiz do mkcert (sem chave privada), para
# o Argo CD confiar no TLS do authentik.lan sem montar CA no pod.
data:
  url: https://argocd.lan
  oidc.config: |
    name: Authentik
    issuer: https://authentik.lan/application/o/argocd/
    clientID: argocd
    clientSecret: $argocd-oidc:ARGOCD_OIDC_CLIENT_SECRET
    requestedScopes: ["openid", "profile", "email", "groups"]
    requestedIDTokenClaims: {"groups": {"essential": true}}
    logoutURL: https://authentik.lan/application/o/argocd/end-session/?id_token_hint={{token}}
    rootCA: |
