# TLS: cert dedicado ceph-dashboard-tls (mkcert, issuer local-ca) — o wildcard
# *.lan é rejeitado pelos validadores para hosts .lan de label único.
# Acesso: https://ceph.lan — login admin do Ceph (rook-ceph-dashboard-password).
# (Basic-auth do HAProxy removido — autenticação é feita pelo próprio dashboard.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ceph-dashboard
  namespace: ceph-dashboard
  annotations:
    haproxy.org/ingress.class: haproxy
    haproxy.org/ssl-cert-namespace: ceph-dashboard
    haproxy.org/ssl-cert: ceph-dashboard-tls
spec:
  tls:
    - hosts:
        - ceph.lan
      secretName: ceph-dashboard-tls
  rules:
    - host: ceph.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ceph-dashboard-svc
                port:
                  number: 7000
