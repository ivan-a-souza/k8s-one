# Cria/reconcilia a role e o banco do Phoenix também em um PostgreSQL já
# inicializado. O initdb (03-configmap-initdb.yaml) só roda num volume vazio;
# este hook é a ponte GitOps para a instância existente e é seguro reexecutar.
apiVersion: batch/v1
kind: Job
metadata:
  name: phoenix-db-bootstrap
  namespace: data
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: postgres:18.6
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: postgres-password
            - name: PHOENIX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: phoenix-db
                  key: password
          command: ["bash", "-ec"]
          args:
            - |
              psql_super() {
                psql --host postgres.data.svc.cluster.local --username postgres \
                  --dbname postgres --no-password --set ON_ERROR_STOP=1 "$@"
              }
              password_sql=${PHOENIX_DB_PASSWORD//\'/\'\'}
              if ! psql_super --tuples-only --no-align \
                --command "SELECT 1 FROM pg_roles WHERE rolname = 'phoenix'" | grep -qx 1; then
                psql_super --command "CREATE ROLE phoenix LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE"
              fi
              psql_super --command "ALTER ROLE phoenix PASSWORD '$password_sql'"
              if ! psql_super --tuples-only --no-align \
                --command "SELECT 1 FROM pg_database WHERE datname = 'phoenix'" | grep -qx 1; then
                psql_super --command "CREATE DATABASE phoenix OWNER phoenix"
              fi
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
