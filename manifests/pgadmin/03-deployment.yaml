# pgAdmin 4 no ns `data` — roda NAO-ROOT e SEM escalonamento.
#
# Atrás do HAProxy ingress (TLS terminado no ingress, HTTP para o pod): o
# pgAdmin so confia nos headers X-Forwarded-* se os *_COUNT correspondentes
# forem setados — sem isso o redirect/login quebra atras de proxy.
# ENHANCED_COOKIE_PROTECTION=False pelo mesmo motivo (mesmo ajuste do inf ra).
#
# Login inicial: PGADMIN_DEFAULT_EMAIL/_PASSWORD do Secret pgadmin-credentials.
#
# ⚠️ POR QUE `capabilities.add: [NET_BIND_SERVICE]` num container nao-root:
# o binario /usr/local/bin/python3.14 da imagem tem a FILE-CAPABILITY
# cap_net_bind_service=eip (para poder bindar a 80 como nao-root). O kernel
# RECUSA (EPERM) o execve de um binario com file-cap quando a bounding set nao
# contem essa cap — entao `drop: [ALL]` sozinho quebra o container no primeiro
# python (`/venv/bin/python3: Operation not permitted`). Manter SO essa cap na
# bounding set destrava o exec; com allowPrivilegeEscalation=false ela nem
# chega a ser efetiva em uso, e como o pgAdmin escuta em 8080 (porta
# nao-privilegiada, via PGADMIN_LISTEN_PORT) ela e dispensavel na pratica.
#
# PGADMIN_DISABLE_POSTFIX=1: o postfix era o UNICO uso de `sudo` do entrypoint;
# desabilitado, o container nao precisa de privilegio nenhum.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: data
  labels:
    app: pgadmin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      securityContext:
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9.18.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: pgadmin-credentials
          env:
            # Elimina o unico `sudo` do entrypoint (postfix).
            - name: PGADMIN_DISABLE_POSTFIX
              value: "1"
            # Escuta em porta nao-privilegiada (nao depende da cap p/ bindar).
            - name: PGADMIN_LISTEN_PORT
              value: "8080"
            - name: PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION
              value: "False"
            - name: PGADMIN_CONFIG_PROXY_X_FOR_COUNT
              value: "1"
            - name: PGADMIN_CONFIG_PROXY_X_PROTO_COUNT
              value: "1"
            - name: PGADMIN_CONFIG_PROXY_X_HOST_COUNT
              value: "1"
            - name: PGADMIN_CONFIG_PROXY_X_PORT_COUNT
              value: "1"
            # --- SSO pelo Authentik (provider `PgAdmin` no blueprint) ---
            # O pgAdmin le o provider SOMENTE da lista OAUTH2_CONFIG: vars
            # individuais (PGADMIN_CONFIG_OAUTH2_CLIENT_ID etc.) sao ignoradas
            # (com warning no boot). O par client_id/secret vem do Secret
            # `pgadmin-oidc` e e injetado via $(...) — o segredo nao fica aqui.
            - name: PGADMIN_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pgadmin-oidc
                  key: PGADMIN_OIDC_CLIENT_ID
            - name: PGADMIN_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pgadmin-oidc
                  key: PGADMIN_OIDC_CLIENT_SECRET
            # 'internal' fica como login de emergencia (como Grafana/ArgoCD).
            - name: PGADMIN_CONFIG_AUTHENTICATION_SOURCES
              value: "['oauth2', 'internal']"
            # Discovery do Authentik (issuer = slug `pgadmin`): o id_token e
            # validado via JWKS e o usuario local e criado no 1o login.
            # OAUTH2_ADDITIONAL_CLAIMS e o gate do lado do pgAdmin (grupo
            # pgadmin-users) — defesa em profundidade alem do binding do IdP.
            - name: PGADMIN_CONFIG_OAUTH2_CONFIG
              value: "[{'OAUTH2_NAME':'authentik','OAUTH2_DISPLAY_NAME':'Authentik','OAUTH2_CLIENT_ID':'$(PGADMIN_OIDC_CLIENT_ID)','OAUTH2_CLIENT_SECRET':'$(PGADMIN_OIDC_CLIENT_SECRET)','OAUTH2_SERVER_METADATA_URL':'https://authentik.lan/application/o/pgadmin/.well-known/openid-configuration','OAUTH2_SCOPE':'openid email profile','OAUTH2_USERNAME_CLAIM':'preferred_username','OAUTH2_ICON':'fa-key','OAUTH2_ADDITIONAL_CLAIMS':{'groups':['pgadmin-users']}}]"
            # O pgAdmin valida o id_token contra o JWKS do authentik.lan: precisa
            # confiar na raiz do mkcert. O ca.crt vem do secret `pgadmin-tls`
            # (todo secret tls do cert-manager carrega a CA da emissora).
            # REQUESTS_CA_BUNDLE cobre o `requests` (token/JWKS) e SSL_CERT_FILE
            # cobre o contexto ssl do Python.
            - name: REQUESTS_CA_BUNDLE
              value: /etc/pgadmin/mkcert-ca/ca.crt
            - name: SSL_CERT_FILE
              value: /etc/pgadmin/mkcert-ca/ca.crt
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
            - name: servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
            - name: mkcert-ca
              mountPath: /etc/pgadmin/mkcert-ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 448Mi
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          startupProbe:
            httpGet:
              path: /misc/ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pgadmin-data
        - name: servers
          configMap:
            name: pgadmin-servers
        - name: mkcert-ca
          secret:
            secretName: pgadmin-tls
            items:
              - key: ca.crt
                path: ca.crt
