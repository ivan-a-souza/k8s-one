# OpenSearch single-node no ns `data`.
#
# Deployment (nao StatefulSet) + PVC avulso, mesmo desenho do postgres/redis:
# PVC rastreavel e blindado pelo Argo. Recreate (RWO, no unico).
#
# SECURITY DISABLED (DISABLE_SECURITY_PLUGIN=true): nao ha TLS interno nem
# autenticacao — so alcance in-cluster (Service ClusterIP). Exposicao publica
# e apenas a UI do Dashboards (ingress opensearch.lan).
#
# bootstrap.memory_lock + ulimit memlock unlimited: o OpenSearch trava a heap
# na RAM. Requer vm.max_map_count >= 262144 no host (ja esta 262144).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: data
  labels:
    app: opensearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:3.3.2
          imagePullPolicy: IfNotPresent
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: bootstrap.memory_lock
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - name: http
              containerPort: 9200
            - name: performance
              containerPort: 9600
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1500Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["IPC_LOCK"]
          startupProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opensearch-data
