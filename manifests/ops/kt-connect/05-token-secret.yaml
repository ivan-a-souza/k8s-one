# Token de longa duração da SA kt-connect (o k8s 1.24+ não cria mais o Secret
# automaticamente). O kube-controller-manager popula `token` e `ca.crt` assim
# que o Secret existe. É esse token que scripts/kt-connect-kubeconfig.sh embute
# no ./kubeconfig.kt-connect usado pelo ktctl.
apiVersion: v1
kind: Secret
metadata:
  name: kt-connect-token
  namespace: kt-connect
  annotations:
    kubernetes.io/service-account.name: kt-connect
type: kubernetes.io/service-account-token
