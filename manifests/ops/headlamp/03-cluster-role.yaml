apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-admin
  labels:
    app: headlamp
    managed-by: clawdete
# Role dedicada do Headlamp (SA headlamp-admin). Admin amplo, com guarda-corpo.
#
# RBAC e ADITIVO — nao existe "deny". "Admin sem delete em namespaces/PVs/PVCs"
# so da para expressar ENUMERANDO os recursos que podem sofrer delete:
#   - regra 1: leitura + escrita em TODOS os recursos, sem delete;
#   - regra 2: delete liberado apenas nos recursos de trabalho.
# namespaces, persistentvolumes e persistentvolumeclaims ficam de fora da
# regra 2 (delete de PVC no ceph-block destroi os dados do PV). A lista da
# regra 2 cresce conforme a necessidade.
rules:
  # Leitura + escrita em tudo, sem delete.
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  # Delete apenas nos recursos de trabalho (sem namespaces/PVs/PVCs).
  - apiGroups:
      - '*'
    resources:
      - pods
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
      - controllerrevisions
      - jobs
      - cronjobs
      - services
      - endpoints
      - endpointslices
      - configmaps
      - secrets
      - serviceaccounts
      - replicationcontrollers
      - ingresses
      - networkpolicies
      - horizontalpodautoscalers
      - poddisruptionbudgets
      - events
      - roles
      - rolebindings
      - certificates
      - certificaterequests
    verbs:
      - delete
      - deletecollection
  # Discovery da API (nonResource) — o Headlamp usa para montar a UI.
  - nonResourceURLs:
      - '*'
    verbs:
      - get
