apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: ops
  annotations:
    haproxy.org/ingress.class: haproxy
    haproxy.org/ssl-cert-namespace: ops
    haproxy.org/ssl-cert: headlamp-tls
spec:
  tls:
    - hosts:
        - headlamp.lan
      secretName: headlamp-tls
  rules:
    - host: headlamp.lan
      http:
        paths:
# O ingress aponta para o oauth2-proxy (nao direto para o Headlamp): ele faz o
# login OIDC no Authentik e so entao encaminha para o Headlamp. O caminho
# /oauth2/* e tratado pelo proprio proxy.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 80
