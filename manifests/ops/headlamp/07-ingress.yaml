apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: ops
  annotations:
    haproxy.org/ingress.class: haproxy
    haproxy.org/ssl-cert-namespace: ops
    haproxy.org/ssl-cert: headlamp-tls
spec:
  tls:
    - hosts:
        - headlamp.lan
      secretName: headlamp-tls
  rules:
    - host: headlamp.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
