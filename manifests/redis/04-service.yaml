# Redis: redis.data.svc.cluster.local:6379 in-cluster + NodePort 30637 no host
# (192.168.32.2:30637), mesmo padrao do postgres (NodePort 30432). O ClusterIP
# continua valido para os consumidores in-cluster (ex.: naesquina-api).
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data
  labels:
    app: redis
spec:
  type: NodePort
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      nodePort: 30637
      protocol: TCP
