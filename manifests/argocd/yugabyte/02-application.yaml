apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yugabyte
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  source:
    chart: yugabyte
    repoURL: https://charts.yugabyte.com
    targetRevision: 2026.1.1
    helm:
      releaseName: yugabyte
      values: |
        # YugabyteDB single-node no k8s-one — espelho do yugabytedb do infra (2025.1.x -> 2026.1.x)
        # YSQL: yb-tservers.<ns>.svc:5433 (headless). Master+tserver co-localizados (1 replica cada).
        # Namespace = data (domínio de bancos/cache).
        replicas:
          master: 1
          tserver: 1
        storage:
          ephemeral: false
          master:
            count: 1
            size: 5Gi
            storageClass: ceph-block
          tserver:
            count: 1
            size: 10Gi
            storageClass: ceph-block
        resource:
          master:
            requests:
              cpu: "100m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          tserver:
            requests:
              cpu: "250m"
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
        # ybCleanup e um sidecar injetado pelo chart (sleep 3600 + log_cleanup.sh)
        # que NAO aparece no bloco `resource:` acima — o scheduler soma os dois.
        # O default do chart reserva 0.25 cpu / 250Mi POR POD, ou seja 500m de CPU
        # (17% dos 3 cores alocaveis do no) para dois `sleep`. O template so
        # renderiza `resources:` quando a chave existe, entao estes valores mantem
        # o sidecar bounded sem inflar o scheduling.
        ybCleanup:
          resources:
            requests:
              cpu: "10m"
              memory: 32Mi
            limits:
              cpu: "100m"
              memory: 128Mi
        # Probe de disco do chart usa timeout de 1s por padrao; no k8s-one o
        # storage e Ceph sobre nbd e o `sync` estoura 1s sob carga, reiniciando
        # os pods. Folga o timeout/periodo p/ tolerar IO lento.
        livenessProbe:
          enabled: true
          timeoutSeconds: 5
          periodSeconds: 30
          failureThreshold: 6
          successThreshold: 1
        # Sem LoadBalancer: acesso é só intra-cluster via service headless (authentik usa yb-tservers:5433).
        enableLoadBalancer: false
        yugabytedUi:
          enabled: false
        ybc:
          enabled: false
        gflags:
          master:
            default_memory_limit_to_ram_ratio: 0.15
          tserver:
            num_cpus: 1
            # GFlags numericos como string p/ evitar notacao cientifica (int64 parse)
            db_block_cache_size_bytes: "67108864"
            rocksdb_compact_flush_rate_limit_bytes_per_sec: "33554432"
            tablet_overhead_size_percentage: "0"
            max_clock_skew_usec: "5000000"
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.status
        - .spec.volumeClaimTemplates[]?.metadata.creationTimestamp
        - .spec.volumeClaimTemplates[]?.spec.volumeMode
        - .spec.persistentVolumeClaimRetentionPolicy
        - .spec.revisionHistoryLimit
