apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  source:
    chart: authentik
    repoURL: https://goauthentik.github.io/helm
    targetRevision: 2026.8.1
    helm:
      releaseName: authentik
      values: |
        # Authentik 2026.8.1 — SSO/IdP no k8s-one (domínio platform).
        # Banco = a instância PostgreSQL compartilhada do ns data
        # (manifests/postgres/), a MESMA que serve o LiteLLM, em banco separado
        # (`authentik`, role `authentik`). A migração do PG que o chart subia
        # saiu do PG 17.11 para o 18.6 por pg_dump/pg_restore.
        # 2026.x não usa mais Redis.
        authentik:
          enabled: true
          existingSecret:
            secretName: authentik-config
        # ConfigMap com os blueprints (declarativo). O chart monta cada nome em
        # /blueprints/mounted/cm-<nome> dentro do WORKER, que aplica todo *.yaml.
        # O ConfigMap em si e criado por `kubectl apply -f 03-blueprint.yaml` e
        # NAO pelo Helm — ver o comentario no topo daquele arquivo.
        blueprints:
          configMaps:
            - authentik-blueprints
        # PostgreSQL embutido do chart DESLIGADO: o banco agora é o do cluster
        # (ns data), o mesmo que serve o LiteLLM. Ficou ligado até o SSO estar
        # validado no banco novo — era o caminho de rollback. Desligar aqui faz
        # o Argo CD podar o StatefulSet do PG embutido (o PVC dele NÃO é
        # rastreado pelo Argo e sai à mão).
        #
        # ⚠️ A conexão NÃO é configurada aqui: `authentik-config` traz
        # AUTHENTIK_POSTGRESQL__{HOST,PORT,USER,PASSWORD,NAME,SSLMODE} e o
        # server/worker recebem esse Secret inteiro por `envFrom`. Trocar de
        # banco é editar secrets/authentik.env e re-rodar scripts/create-secrets.sh.
        postgresql:
          enabled: false
        serviceAccount:
          create: false
        server:
          replicas: 1
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1024Mi
          ingress:
            enabled: true
            annotations:
              haproxy.org/ingress.class: haproxy
              haproxy.org/ssl-cert-namespace: platform
              haproxy.org/ssl-cert: authentik-tls
            hosts:
              - authentik.lan
            tls:
              - secretName: authentik-tls
                hosts:
                  - authentik.lan
        worker:
          replicas: 1
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1024Mi
        additionalObjects:
          - apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: authentik-tls
              namespace: platform
            spec:
              secretName: authentik-tls
              issuerRef:
                name: local-ca
                kind: ClusterIssuer
              commonName: authentik.lan
              dnsNames:
                - authentik.lan
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
