apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: platform
data:
  # Blueprint do provider OIDC que a UI do LiteLLM usa para autenticar.
  #
  # Por que este arquivo e aplicado por `kubectl` e NAO pelo Helm (nao esta em
  # `additionalObjects` do 02-application.yaml): as tags `!Find`, `!KeyOf` e
  # `!Env` do blueprint sao YAML customizado, e o caminho values -> toYaml do
  # Helm faz parse e re-serializacao — as tags chegam no cluster destruidas
  # (viram string solta) e o blueprint falha. Como string num ConfigMap, elas
  # passam intactas.
  #
  # O chart do authentik monta os ConfigMaps listados em `blueprints.configMaps`
  # dentro do WORKER (templates/worker/deployment.yaml, em
  # /blueprints/mounted/cm-<nome>); o worker descobre todo *.yaml de la e aplica.
  # A referencia esta no 02-application.yaml.
  #
  # Idempotencia: quem manda e o campo `identifiers` de cada entry — o importer
  # monta um filter() com ele; se achar, atualiza (partial=True), se nao, cria.
  # O `id` serve so para o `!KeyOf` de outras entries. Sem `identifiers` o
  # blueprint aborta com "No or invalid identifiers".
  #
  # Segredos: o `!Env` le variavel de ambiente do worker, que recebe TODAS as
  # chaves do Secret `authentik-config` via envFrom. As duas chaves
  # LITELLM_OIDC_* ficam em secrets/authentik.env (gitignored) e precisam ter os
  # MESMOS valores que GENERIC_CLIENT_ID/GENERIC_CLIENT_SECRET no
  # secrets/litellm.env — sao o mesmo par de credenciais, visto dos dois lados.
  litellm-oidc.yaml: |
    version: 1
    metadata:
      name: litellm-oidc
      labels:
        blueprints.goauthentik.io/description: Provider OIDC da UI do LiteLLM (k8s-one)
    # Descoberta: o worker roda o discovery de hora em hora (ScheduleSpec com
    # send_on_startup=True, que tambem dispara no boot do worker) e mantem um
    # watcher de arquivos. O watcher depende de evento de criacao/modificacao —
    # e o volume de ConfigMap so e re-sincronizado quando os DADOS mudam:
    # `kubectl annotate` (metadata) nao gera evento nenhum.
    entries:
      # Mantem o e-mail do admin igual ao AUTHENTIK_BOOTSTRAP_EMAIL do Secret
      # (gitignored): o bootstrap so vale quando o banco e criado, entao sem
      # esta entry um e-mail corrigido depois ficaria divergente entre o Secret
      # e o usuario — e o e-mail e o que o LiteLLM usa para provisionar o
      # usuario dele no primeiro login.
      #
      # O valor vem por !Env em vez de literal para nao versionar e-mail
      # pessoal num arquivo publico. O `partial=True` do importer garante que
      # so o campo `email` e tocado neste usuario.
      - model: authentik_core.user
        id: akadmin-user
        identifiers:
          username: akadmin
        attrs:
          email: !Env AUTHENTIK_BOOTSTRAP_EMAIL

      # Grupo que controla quem entra. Nao existe binding nenhum na Application
      # alem dos dois abaixo, o acesso e exatamente a uniao das listas
      # destes grupos (policy_engine_mode: any = basta UM binding passar).
      - model: authentik_core.group
        id: litellm-group
        identifiers:
          name: litellm-users
        attrs:
          name: litellm-users
          users:
            - !Find [authentik_core.user, [username, akadmin]]

      # Grupo que da ROLE de admin no LiteLLM. E separado do litellm-users
      # porque sao duas perguntas diferentes: "quem entra" (o binding) e "o que
      # pode fazer dentro" (o claim `litellm_role`, logo abaixo). Quem esta aqui
      # tem binding proprio mais abaixo, senao seria admin de um app em que nao
      # consegue entrar.
      - model: authentik_core.group
        id: litellm-admins-group
        identifiers:
          name: litellm-admins
        attrs:
          name: litellm-admins
          users:
            - !Find [authentik_core.user, [username, akadmin]]

      # Scope proprio do LiteLLM: e o claim que diz a ROLE do usuario. Sem ele o
      # LiteLLM nao recebe papel nenhum e cai no default DELE
      # (`internal_user_viewer`) — que foi o que aconteceu ate 24/09/2026.
      #
      # O claim so chega no token se as DUAS pontas concordarem: o scope_name
      # tem que estar em `property_mappings` aqui embaixo E o client tem que
      # pedir no `scope=` do /authorize (o LiteLLM pede via GENERIC_SCOPE, no
      # Secret litellm-env). Faltando um dos lados o claim nao sai, em silencio:
      # o /authorize so faz a INTERSECAO do pedido com os mappings do provider.
      #
      # O valor tem que ser um role exato e valido do LiteLLM: proxy_admin,
      # proxy_admin_viewer, internal_user ou internal_user_viewer. Nome errado
      # nao da erro nenhum — cai no default, igual a nao ter claim.
      - model: authentik_providers_oauth2.scopemapping
        id: litellm-role-mapping
        identifiers:
          name: LiteLLM Role
        attrs:
          name: LiteLLM Role
          scope_name: litellm_role
          description: Papel do usuario no LiteLLM (proxy_admin para litellm-admins)
          expression: |
            if "litellm-admins" in [group.name for group in request.user.groups.all()]:
                return {"litellm_role": "proxy_admin"}
            return {"litellm_role": "internal_user_viewer"}

      - model: authentik_providers_oauth2.oauth2provider
        id: litellm-provider
        identifiers:
          # `name` mora em authentik_core_provider (heranca multi-tabela), mas o
          # Django filtra pelo pai normalmente.
          name: LiteLLM
        attrs:
          name: LiteLLM
          # Fluxo de autorizacao com consentimento implicito: o usuario ve
          # "voce esta entrando no LiteLLM" e segue, sem tela de consentimento.
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          client_type: confidential
          # OBRIGATORIO declarar: o modelo do authentik tem
          # `grant_types = ArrayField(..., default=list)` — lista VAZIA. O wizard
          # da UI preenche sozinho, entao isso passa despercebido; um blueprint
          # que omite cria um provider que recusa todo grant ("Invalid grant_type
          # for provider" no log, e o /authorize devolve invalid_request).
          grant_types:
            - authorization_code
            - refresh_token
          # Sem default: se a env var faltar, o `!Env` devolve None e o
          # serializer do authentik recusa — falha alta em vez de provider com
          # segredo vazio.
          client_id: !Env LITELLM_OIDC_CLIENT_ID
          client_secret: !Env LITELLM_OIDC_CLIENT_SECRET
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          redirect_uris:
            # O default do LiteLLM e {PROXY_BASE_URL}/sso/callback, e o
            # PROXY_BASE_URL dele e https://litellm.lan.
            - matching_mode: strict
              url: https://litellm.lan/sso/callback
            # Rota de debug do LiteLLM: mostra os campos do JWT sem completar o
            # login. Custa nada e evita ter que mexer no provider pra depurar.
            - matching_mode: strict
              url: https://litellm.lan/sso/debug/callback
          # Os scope mappings TEM que ser declarados: se omitidos, o provider
          # nasce sem escopo nenhum e o token volta sem `email` — o LiteLLM nao
          # teria com que identificar o usuario. Os tres `managed` abaixo foram
          # conferidos no banco desta instancia.
          #
          # O quarto e o scope proprio `litellm_role` (entry `litellm-role-mapping`
          # acima): e o que carrega a role. Estar nesta lista e o que AUTORIZA o
          # scope — sem ele o pedido do client e descartado na intersecao.
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
            - !Find [authentik_core.propertymapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
            - !Find [authentik_core.propertymapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
            - !Find [authentik_core.propertymapping, [name, "LiteLLM Role"]]

      - model: authentik_core.application
        id: litellm-app
        identifiers:
          slug: litellm
        attrs:
          name: LiteLLM
          slug: litellm
          provider: !KeyOf litellm-provider
          # Vira o link do tile no portal do authentik em /if/user/.
          meta_launch_url: https://litellm.lan
          meta_description: Proxy OpenAI-compativel do cluster
          meta_publisher: k8s-one
          policy_engine_mode: any

      # Bindings da Application — sao eles que decidem quem entra. Sem nenhum,
      # qualquer usuario ativo entra; com eles, so quem esta em litellm-users ou
      # em litellm-admins.
      - model: authentik_policies.policybinding
        id: litellm-app-binding
        identifiers:
          target: !KeyOf litellm-app
          group: !KeyOf litellm-group
        attrs:
          target: !KeyOf litellm-app
          group: !KeyOf litellm-group
          order: 0
          enabled: true

      # Binding do grupo de admins: sem ele um `litellm-admins` receberia a role
      # de admin e continuaria sem conseguir logar (o acesso exige um binding).
      - model: authentik_policies.policybinding
        id: litellm-admins-app-binding
        identifiers:
          target: !KeyOf litellm-app
          group: !KeyOf litellm-admins-group
        attrs:
          target: !KeyOf litellm-app
          group: !KeyOf litellm-admins-group
          order: 1
          enabled: true

  # Provider OIDC da UI do Headlamp (dashboard do Kubernetes, ns ops). Mesmo
  # padrao do litellm-oidc acima: o Headlamp autentica o usuario aqui e, em
  # modo in-cluster, continua falando com a API pelo ServiceAccount
  # headlamp-admin (RBAC do proprio cluster). O login OIDC nao troca o token
  # de API — so controla quem entra no dashboard.
  #
  # O callback do Headlamp e a URL da UI + /oidc-callback. O issuer que ele
  # descobre e https://authentik.lan/application/o/headlamp/ (o slug da
  # Application abaixo define o caminho).
  headlamp-oidc.yaml: |
    version: 1
    metadata:
      name: headlamp-oidc
      labels:
        blueprints.goauthentik.io/description: Provider OIDC do Headlamp (k8s-one)
    entries:
      # Grupo que controla quem entra no Headlamp.
      - model: authentik_core.group
        id: headlamp-group
        identifiers:
          name: headlamp-users
        attrs:
          name: headlamp-users
          users:
            - !Find [authentik_core.user, [username, akadmin]]

      - model: authentik_providers_oauth2.oauth2provider
        id: headlamp-provider
        identifiers:
          name: Headlamp
        attrs:
          name: Headlamp
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          client_type: confidential
          # OBRIGATORIO: o modelo nasce com grant_types vazio (ver comentario no
          # litellm-provider) — sem declarar, todo grant e recusado.
          grant_types:
            - authorization_code
            - refresh_token
          client_id: !Env HEADLAMP_OIDC_CLIENT_ID
          client_secret: !Env HEADLAMP_OIDC_CLIENT_SECRET
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          redirect_uris:
            # Callback do oauth2-proxy (auth proxy na frente do Headlamp). O
            # Headlamp em si NAO usa mais OIDC direto: quem faz o fluxo e o
            # oauth2-proxy, e o Headlamp autentica a API pelo SA (flag
            # unsafe-use-service-account-token, segura porque ha o proxy).
            - matching_mode: strict
              url: https://headlamp.lan/oauth2/callback
          # Sem os scope mappings o token volta sem email/profile e o Headlamp
          # nao identifica o usuario. Os tres `managed` sao os padrao do authentik.
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
            - !Find [authentik_core.propertymapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
            - !Find [authentik_core.propertymapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]

      - model: authentik_core.application
        id: headlamp-app
        identifiers:
          slug: headlamp
        attrs:
          name: Headlamp
          slug: headlamp
          provider: !KeyOf headlamp-provider
          # Tile no portal do authentik (/if/user/).
          meta_launch_url: https://headlamp.lan
          meta_description: Dashboard do Kubernetes (k8s-one)
          meta_publisher: k8s-one
          policy_engine_mode: any

      # Unico binding: so quem esta em headlamp-users entra.
      - model: authentik_policies.policybinding
        id: headlamp-app-binding
        identifiers:
          target: !KeyOf headlamp-app
          group: !KeyOf headlamp-group
        attrs:
          target: !KeyOf headlamp-app
          group: !KeyOf headlamp-group
          order: 0
          enabled: true

  # Provider OIDC do Grafana (metricas/dashboards, ns monitoring). Mesmo padrao
  # do headlamp-oidc: o Grafana fala OIDC nativamente (nao tem proxy na frente),
  # e o paper e DO LADO DELE — o Authentik so entrega os claims.
  #
  # Aqui NAO existe scope mapping proprio (ao contrario do litellm): o Grafana
  # decide o papel com um `role_attribute_path` (JMESPath) em cima do claim
  # `groups`, e esse claim ja vem de graca — o scope mapping `profile`, que
  # sempre esteve na lista, devolve `groups: [group.name for ...]`. O que o
  # Grafana le e o NOME do grupo, nao um valor de role: por isso o par
  # (grupo `grafana-admins` -> `GrafanaAdmin`) mora no grafana.ini, nao aqui.
  #
  # O papel e re-sincronizado a cada login (o Grafana nao tem skip_org_role_sync
  # ligado), entao promover/rebaixar alguem = mexer no grupo, nao no Grafana.
  grafana-oidc.yaml: |
    version: 1
    metadata:
      name: grafana-oidc
      labels:
        blueprints.goauthentik.io/description: Provider OIDC do Grafana (k8s-one)
    entries:
      # Grupo que controla quem entra. O Grafana nao tem `allowed_groups`
      # configurado: o gate e este binding, um lugar so.
      - model: authentik_core.group
        id: grafana-group
        identifiers:
          name: grafana-users
        attrs:
          name: grafana-users
          users:
            - !Find [authentik_core.user, [username, akadmin]]

      # Grupo que da GrafanaAdmin (admin DE SERVIDOR: usuarios, orgs, plugins).
      # Mesmo par do litellm-users/litellm-admins: quem entra != o que pode
      # fazer. Tem binding proprio abaixo, senao seria admin de um app onde nao
      # consegue entrar.
      - model: authentik_core.group
        id: grafana-admins-group
        identifiers:
          name: grafana-admins
        attrs:
          name: grafana-admins
          users:
            - !Find [authentik_core.user, [username, akadmin]]

      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        identifiers:
          name: Grafana
        attrs:
          name: Grafana
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          client_type: confidential
          # ArrayField com default vazio: sem declarar, o provider recusa todo
          # grant (ver a nota no provider do litellm).
          grant_types:
            - authorization_code
            - refresh_token
          client_id: !Env GRAFANA_OIDC_CLIENT_ID
          client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          # O `sub` e hasheado (nao vaza o usuario). O Grafana nao usa o sub
          # como login: o grafana.ini aponta `login_attribute_path` para
          # `preferred_username`, que tambem vem no scope `profile`.
          sub_mode: hashed_user_id
          # Obrigatorio para o Grafana: com ele o ID token carrega os mesmos
          # claims do userinfo, e o `role_attribute_path` resolve na PRIMEIRA
          # tentativa (ID token) em vez de depender do userinfo.
          include_claims_in_id_token: true
          redirect_uris:
            # Callback nativo do Grafana (auth.generic_oauth). Derivado do
            # `root_url` do grafana.ini: se o root_url sumir, o redirect_uri
            # passa a sair do Host do request e o authentik recusa.
            - matching_mode: strict
              url: https://grafana.lan/login/generic_oauth
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
            - !Find [authentik_core.propertymapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
            - !Find [authentik_core.propertymapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]

      - model: authentik_core.application
        id: grafana-app
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          slug: grafana
          provider: !KeyOf grafana-provider
          # O slug acima define o caminho do issuer (/application/o/grafana/) e
          # do end-session, que o grafana.ini usa no signout_redirect_url.
          meta_launch_url: https://grafana.lan
          meta_description: Metricas e dashboards do cluster
          meta_publisher: k8s-one
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        id: grafana-app-binding
        identifiers:
          target: !KeyOf grafana-app
          group: !KeyOf grafana-group
        attrs:
          target: !KeyOf grafana-app
          group: !KeyOf grafana-group
          order: 0
          enabled: true

      # Binding do grupo de admins (sem ele, admin com role e sem login).
      - model: authentik_policies.policybinding
        id: grafana-admins-app-binding
        identifiers:
          target: !KeyOf grafana-app
          group: !KeyOf grafana-admins-group
        attrs:
          target: !KeyOf grafana-app
          group: !KeyOf grafana-admins-group
          order: 1
          enabled: true
