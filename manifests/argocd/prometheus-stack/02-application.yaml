apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 90.0.0
    helm:
      releaseName: kube-prometheus-stack
      values: |
        # Ajustes para single-node k8s-one (23GB RAM host, ceph-block default)
        prometheus:
          prometheusSpec:
            replicas: 1
            retention: 7d
            resources:
              requests:
                memory: 512Mi
              limits:
                memory: 1Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: ceph-block
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
        alertmanager:
          enabled: true
          alertmanagerSpec:
            replicas: 1
            resources:
              requests:
                memory: 64Mi
              limits:
                memory: 256Mi
        grafana:
          # Senha vem do Secret gitignored (secrets/grafana-admin.yaml),
          # criado por scripts/create-secrets.sh. Nunca embutir aqui.
          # Continua valendo depois do SSO: é o login de emergência (não passa
          # pelo authentik) e é com ele que os sidecars falam com a API local.
          admin:
            existingSecret: grafana-admin

          # SSO pelo authentik (provider `Grafana` no blueprint 03-blueprint.yaml
          # do authentik). O par client_id/client_secret NÃO está aqui: vem do
          # Secret grafana-oidc (gitignored) como env GF_* — env var sobrepõe o
          # grafana.ini, então a credencial nunca chega ao ConfigMap (é o que o
          # `assertNoLeakedSecrets` do chart confere no render).
          envFromSecret: grafana-oidc

          # O pod é distroless e roda com rootfs read-only: não dá para
          # concatenar um bundle de CA como o litellm faz (nem shell tem). A
          # raiz do mkcert entra MONTADA — o secret grafana-tls, que o
          # cert-manager já emite para o grafana.lan, carrega o ca.crt (todo
          # secret tls do cert-manager carrega), como o litellm-tls.
          #
          # Tem que ser `extraSecretMounts`, NAO `extraVolumes`: o template do
          # chart (templates/_pod.tpl) so sabe renderizar existingClaim,
          # hostPath, csi, configMap e emptyDir — um volume `secret:` cai no
          # else e vira emptyDir VAZIO, sem erro nenhum (o pod sobe e o
          # tls_client_ca aponta para um arquivo que nao existe). O
          # extraSecretMounts ja monta o volume e o mountPath de uma vez.
          extraSecretMounts:
            - name: mkcert-ca
              mountPath: /etc/grafana/mkcert-ca
              secretName: grafana-tls
              # 0444 (o chart renderiza como inteiro; o default vazio viraria
              # `defaultMode:` nulo). É certificado público — o sigilo é da
              # chave, que fica no tls.key e não é montada (só o items abaixo).
              defaultMode: 0444
              readOnly: true
              items:
                - key: ca.crt
                  path: ca.crt

          # `grafana.ini` faz deep-merge com os defaults do chart (paths,
          # analytics, unified_storage continuam lá). Mapa de mapa vira seção do
          # ini; a chave com ponto vira `[auth.generic_oauth]`.
          grafana.ini:
            server:
              # Obrigatório para o SSO: o redirect_uri do fluxo é derivado do
              # root_url. Sem ele o Grafana monta a URL a partir do Host do
              # request (http, atrás do ingress) e o authentik recusa por não
              # bater com o registrado no provider.
              root_url: https://grafana.lan/
            auth.generic_oauth:
              enabled: true
              name: Authentik
              # Quem entra é decidido no authentik (binding do grupo
              # grafana-users); esta flag só permite criar a conta local no
              # primeiro login.
              allow_sign_up: true
              scopes: openid profile email
              auth_url: https://authentik.lan/application/o/authorize/
              token_url: https://authentik.lan/application/o/token/
              api_url: https://authentik.lan/application/o/userinfo/
              # Confia na raiz do mkcert para falar com o authentik.lan — é o
              # equivalente Go do `--provider-ca-file` que o oauth2-proxy do
              # headlamp usa. Sem isso a troca de token morre em erro x509 (a
              # imagem não conhece o mkcert). Em vez de tls_skip_verify_insecure,
              # que aceitaria qualquer certificado.
              tls_client_ca: /etc/grafana/mkcert-ca/ca.crt
              # Sem isto o login do usuário vira o `sub` hasheado do authentik
              # (sub_mode: hashed_user_id no provider). Os dois claims vêm do
              # scope `profile`.
              login_attribute_path: preferred_username
              name_attribute_path: name
              # O papel sai do GRUPO, não de um claim de role: o scope `profile`
              # já devolve `groups`, e o Grafana avalia este JMESPath primeiro
              # no ID token (include_claims_in_id_token no provider) — resolve
              # de primeira, sem depender do userinfo.
              role_attribute_path: "contains(groups, 'grafana-admins') && 'GrafanaAdmin' || 'Viewer'"
              # Falha alta: se o claim `groups` faltar, o login é NEGADO em vez
              # de rebaixar todo mundo para Viewer em silêncio — a lição do
              # LiteLLM (que caía em internal_user_viewer sem avisar).
              role_attribute_strict: true
              # 'GrafanaAdmin' acima só vira admin DE SERVIDOR com esta flag;
              # sem ela o resultado seria apenas Admin da organização.
              allow_assign_grafana_admin: true
              # Logout do Grafana encerra também a sessão no authentik (senão o
              # próximo login volta direto, sem pedir senha). O caminho usa o
              # slug da Application no blueprint.
              signout_redirect_url: https://authentik.lan/application/o/grafana/end-session/

          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          persistence:
            enabled: true
            storageClassName: ceph-block
            accessModes: ["ReadWriteOnce"]
            size: 10Gi
          service:
            type: ClusterIP
          # Sidecars REATIVADOS (padrão do chart): o CA do k8s-one agora tem
          # keyUsage (entrypoint.sh corrigido + CA rotacionado em 08/09/2026),
          # então o kiwigrid/k8s-sidecar valida TLS normalmente.
          sidecar:
            resources:
              requests:
                memory: 32Mi
              limits:
                memory: 128Mi
            datasources:
              enabled: true
            dashboards:
              enabled: true
        nodeExporter:
          enabled: true
        kubeStateMetrics:
          enabled: true
        prometheus-node-exporter:
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
        kube-state-metrics:
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
