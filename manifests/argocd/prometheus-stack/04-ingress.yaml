# Ingress do Grafana (grafana.lan) -> Service do chart (kube-prometheus-stack-grafana:80).
#
# O cluster nao tem IngressClass (todos os ingresses ativos ficam com CLASS
# <none> e roteiam pela annotation haproxy.org/ingress.class) — vazio de
# proposito, igual ao resto do repositorio. Por isso tambem NAO se usa
# `grafana.ingress` do chart: ele renderizaria ingressClassName e quebraria o
# roteamento (ver a nota no README, secao do LiteLLM).
#
# Adocao de recurso que ja existia no cluster criado fora do git (08/09/2026) —
# conteudo identico ao que ja roda, aplicado com `kubectl apply -f`.
#
# O `root_url` do grafana.ini (nos values) e o outro lado disto: e ele que
# garante que o redirect_uri do SSO saia como https://grafana.lan/..., que e o
# que o provider `Grafana` do authentik tem registrado.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    haproxy.org/ingress.class: haproxy
    haproxy.org/ssl-cert: grafana-tls
    haproxy.org/ssl-cert-namespace: monitoring
spec:
  tls:
    - hosts:
        - grafana.lan
      secretName: grafana-tls
  rules:
    - host: grafana.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
