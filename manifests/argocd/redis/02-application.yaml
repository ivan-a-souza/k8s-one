# Argo CD Application do Redis (ns `data`).
#
# Fonte: o PRÓPRIO repo GitOps (k8s-one), caminho manifests/redis. Mesmo padrão
# do postgres/vaultwarden: manifestos próprios, sem chart de terceiros.
#
# Segredo `redis-auth` NÃO está no repo (gitignored) — criar antes com:
#   scripts/create-secrets.sh
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ivan-a-souza/k8s-one.git
    targetRevision: main
    path: manifests/redis
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # `data` já existe; CreateNamespace mantém o ns FORA do tracking do Argo
      # (o finalizer não apaga a namespace — e o PVC junto — ao excluir o app).
      - CreateNamespace=true
