apiVersion: v1
kind: Secret
metadata:
  name: berriai-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: helm
  name: berriai-oci
  # OCI (ghcr): a url é o PAI do chart no path, NÃO o chart em si.
  # O Argo CD monta a referência como "oci://<url>/<chart>" (util/helm/cmd.go,
  # PullOCI) sem nenhum de-dup de segmento — então com a url sendo
  # "ghcr.io/berriai/litellm-helm" e chart "litellm-helm" o ref viraria
  # "oci://ghcr.io/berriai/litellm-helm/litellm-helm" e o pull falharia.
  url: ghcr.io/berriai
  # String, não boolean: o valor de um Secret é sempre string.
  enableOCI: "true"
  project: default
