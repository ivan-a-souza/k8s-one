apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  source:
    # Chart oficial do LiteLLM, publicado SÓ como OCI no ghcr (o repo Helm
    # clássico berriai.github.io/litellm-helm dá 404). A url é o pai do chart —
    # ver o comentário em 01-repo-secret.yaml.
    repoURL: ghcr.io/berriai
    chart: litellm-helm
    # Tag OCI = versão exata do chart. OCI não aceita range semver (^1.89,
    # latest, vazio) — o repo-server do Argo CD rejeita.
    targetRevision: "1.89.2"
    helm:
      releaseName: litellm
      # O chart traz 3 Pods de helm test (templates/tests/*.yaml, todos com
      # `helm.sh/hook: test`). O Argo CD já ignora hooks que não suporta, mas a
      # doc avisa que o skip automático "não é totalmente congruente" com a flag
      # — então declaramos explicitamente para esses Pods nunca serem criados.
      skipTests: true
      values: |
        # LiteLLM 1.89.2 no k8s-one (namespace platform). Espelha o litellm que
        # rodava no docker-compose do infra (ghcr.io/berriai/litellm:main-stable),
        # agora GitOps. Banco = a instância PostgreSQL do ns data, preparada
        # pelo init do manifests/postgres/ (role, banco e schema `litellm`).
        replicaCount: 1
        numWorkers: 1

        image:
          repository: ghcr.io/berriai/litellm-database
          # Explícito em vez de depender do appVersion do chart: um upgrade de
          # chart não troca a imagem do proxy sem a gente querer.
          tag: "1.89.2"
          pullPolicy: IfNotPresent

        # Recreate, não RollingUpdate: no nó único um rollout com maxSurge
        # subiria 2 pods do LiteLLM ao mesmo tempo, e o host (container k8s-one
        # dividindo 23Gi com o desktop) não tem folga de memória pra isso.
        strategy:
          type: Recreate

        # Sem requests o pod fica BestEffort — primeiro candidato a eviction num
        # nó apertado. O proxy carrega o pacote inteiro + o client do Prisma:
        # subia a ~1Gi residente e reiniciava (OOM em nó apertado).
        # Aumentado em 24/09/2026: requests 1Gi / limits 3Gi, pra dar folga.
        # O job de migrations, que faz menos, chegou a ~1,7Gi de pico.
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 3Gi

        # Banco: a instância PostgreSQL compartilhada do ns data
        # (manifests/postgres/). A mesma instância serve o Authentik, em banco
        # separado — um banco por aplicação, com roles distintas.
        db:
          # Obrigatório: o default do chart é true, o que subiria um PostgreSQL
          # embutido em vez de usar o do cluster.
          deployStandalone: false
          useExisting: true
          endpoint: postgres.data.svc.cluster.local
          database: litellm
          # Os $(VAR) são expandidos pelo KUBELET a partir das envs DATABASE_*
          # que o próprio chart define ANTES desta, tanto no deployment quanto no
          # job de migrations (ver templates/deployment.yaml e migrations-job.yaml).
          # A porta vai explícita na URL porque o chart 1.89.2 não tem db.port.
          #   ?schema=litellm  -> o schema dedicado do Prisma, criado pelo init
          #                       do PostgreSQL (manifests/postgres/03-configmap-initdb.yaml).
          #                       `public` também funcionaria — no PG15+ ele
          #                       pertence a pg_database_owner e o dono do banco
          #                       cria lá — mas manter o schema dedicado deixa o
          #                       corte numa variável só.
          url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):5432/$(DATABASE_NAME)?schema=litellm
          secret:
            name: litellm-db
            usernameKey: username
            passwordKey: password

        # Redis do chart desligado: o config atual não usa cache.
        redis:
          enabled: false

        # Sem masterkeySecretName o chart gera uma master key ALEATÓRIA a cada
        # render (randAlphaNum 18 em templates/secret-masterkey.yaml) -> a
        # Application ficaria OutOfSync pra sempre e o selfHeal em loop.
        # O Secret vem de scripts/create-secrets.sh (chave `masterkey`).
        masterkeySecretName: litellm-masterkey
        masterkeySecretKey: masterkey

        # Env do proxy (OPENAI_API_KEY, LITELLM_SALT_KEY, PROXY_BASE_URL, SSO...)
        # via envFrom do Secret gitignored criado por scripts/create-secrets.sh.
        environmentSecrets:
          - litellm-env

        proxyConfigMap:
          create: true
        # Espelho do infra/litellm/config.yaml. A master key vem do
        # PROXY_MASTER_KEY que o chart injeta a partir do masterkeySecretName;
        # o DATABASE_URL é montado pelo próprio chart (db.url acima).
        proxy_config:
          model_list:
            - model_name: gpt-4o-mini
              litellm_params:
                model: openai/gpt-4o-mini
                api_key: os.environ/OPENAI_API_KEY
          general_settings:
            master_key: os.environ/PROXY_MASTER_KEY
            database_url: os.environ/DATABASE_URL
            store_model_in_db: true
            store_prompts_in_spend_logs: true
          router_settings:
            num_retries: 2
            timeout: 60
          # O endpoint /metrics só existe se o callback `prometheus` estiver
          # habilitado — sem ele o LiteLLM devolve 404 e o target do Prometheus
          # fica DOWN (o ServiceMonitor em si funciona: o scrape acontece).
          # E com o callback ligado o endpoint passa a exigir a API key por
          # padrão (401), daí o require_auth... abaixo. O endpoint é ClusterIP,
          # in-cluster, então liberar sem auth é o mesmo trade-off que os outros
          # serviços do cluster já fazem.
          litellm_settings:
            callbacks:
              - prometheus
            require_auth_for_metrics_endpoint: false

        logLevel: INFO

        # Probes com folga de timeout: neste host os pods compartilham CPU/RAM
        # com o desktop inteiro, e timeout curto vira falso "Unhealthy" em massa
        # (foi o incidente de 16/09/2026).
        livenessProbe:
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
        readinessProbe:
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 6
        startupProbe:
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 60

        # Job de migrations do Prisma. Já vem como hook PreSync do Argo CD
        # (argocd.argoproj.io/hook em templates/migrations-job.yaml), então roda
        # antes do Deployment e o proxy sobe com DISABLE_SCHEMA_UPDATE=true.
        migrationJob:
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            # 512Mi (o que eu tinha posto) NÃO basta: o `prisma migrate deploy`
            # do schema do LiteLLM foi OOMKilled (exit 137) nas 4 tentativas.
            # O cgroup kubepods do nó tem ~9,3G de teto com ~5,7G em uso, então
            # 2G de teto cabe — e é um job curto, não um residente.
            limits:
              cpu: "1"
              memory: 2Gi
          # O template do job usa os MESMOS `.Values.volumes`,
          # `.Values.volumeMounts` e `.Values.extraEnvVars` do Deployment, mas
          # NAO o `.Values.extraInitContainers` (cada um tem o seu). Como o
          # `extraEnvVars` do topo traz SSL_CERT_FILE apontando para o bundle,
          # o job precisa do mesmo initContainer aqui — senao o container dele
          # sobe apontando para um arquivo que nao existe.
          extraInitContainers:
            - name: ca-bundle
              image: ghcr.io/berriai/litellm-database:1.89.2
              command: ["sh", "-c"]
              args:
                - cat /etc/ssl/certs/ca-certificates.crt /mkcert/ca.crt > /certs/ca-bundle.crt
              volumeMounts:
                - name: mkcert-ca
                  mountPath: /mkcert
                  readOnly: true
                - name: ca-bundle
                  mountPath: /certs

        # Sem isto o stdout do Python fica bufferizado: como o OOMKill mata o
        # processo com SIGKILL, o buffer se perde e o `kubectl logs` volta VAZIO,
        # sem nenhuma pista do que aconteceu.
        #
        # ENFORCE_PRISMA_MIGRATION_CHECK: sem isto o LiteLLM loga "migration
        # failed but continuing startup" e SAI COM 0 — o Job aparece como
        # Completed com o banco pela metade. Com a flag, falha de migration
        # falha o hook PreSync e o sync para, que é o comportamento que
        # queremos num deploy GitOps.
        #
        # (O PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK que existia aqui foi embora
        # junto com o YugabyteDB. Ele era um contorno para um defeito do YB:
        # o YB não libera o `pg_advisory_lock` quando a sessão morre, então
        # depois de uma tentativa morta por timeout todas as seguintes
        # estouravam em 10s com P1002 e o deploy travou em 88/127 migrations.
        # O PostgreSQL libera o lock no disconnect, então ele volta a ser a
        # proteção contra duas migrações concorrentes.)
        envVars:
          PYTHONUNBUFFERED: "1"
          ENFORCE_PRISMA_MIGRATION_CHECK: "true"

        # --- TLS para falar com o authentik (SSO da UI) ---
        #
        # O proxy troca o `code` do OIDC chamando
        # https://authentik.lan/application/o/token (e depois /userinfo). Esse
        # nome resolve in-cluster para o VIP do MetalLB (bloco `hosts` do
        # CoreDNS) e o certificado e do mkcert — que NAO esta no bundle de CAs
        # do Debian que vem na imagem. Sem isto a troca de code morre com
        # SSLCertVerificationError e o login volta pro /ui sem sessao.
        #
        # O bundle e CONCATENADO, nao substituido: o proxy tambem chama
        # api.openai.com, cujo certificado nao e mkcert — apontar SSL_CERT_FILE
        # so para o CA local quebraria todas as chamadas de modelo.
        #
        # A raiz do mkcert ja esta no ns platform: e o `ca.crt` do secret
        # litellm-tls (emitido pelo ClusterIssuer local-ca), que todo secret
        # tls do cert-manager carrega. Nao precisa criar secret novo.
        volumes:
          - name: mkcert-ca
            secret:
              secretName: litellm-tls
              items:
                - key: ca.crt
                  path: ca.crt
          # emptyDir porque o bundle e derivado na hora, pelo initContainer.
          - name: ca-bundle
            emptyDir: {}
        extraInitContainers:
          - name: ca-bundle
            # Mesma imagem do proxy: nao ha o que instalar, so o `cat`.
            image: ghcr.io/berriai/litellm-database:1.89.2
            command: ["sh", "-c"]
            args:
              - cat /etc/ssl/certs/ca-certificates.crt /mkcert/ca.crt > /certs/ca-bundle.crt
            volumeMounts:
              - name: mkcert-ca
                mountPath: /mkcert
                readOnly: true
              - name: ca-bundle
                mountPath: /certs
        volumeMounts:
          - name: ca-bundle
            mountPath: /certs
            readOnly: true
        # LISTA de env vars, nao mapa: no chart, `envVars` (o de cima, que o job
        # de migrations usa) e um mapa chave-valor, mas `extraEnvVars` e
        # renderizado com toYaml direto na lista de env do container. Mapa aqui
        # quebra o render do Helm inteiro ("did not find expected '-' indicator").
        extraEnvVars:
          - name: SSL_CERT_FILE
            value: /certs/ca-bundle.crt
          - name: REQUESTS_CA_BUNDLE
            value: /certs/ca-bundle.crt

        ingress:
          enabled: true
          # O cluster NÃO tem IngressClass nenhuma (todos os ingresses ativos
          # estão com CLASS <none> e roteiam pela annotation
          # haproxy.org/ingress.class). O default do chart é "nginx", que
          # renderizaria ingressClassName: nginx e quebraria o roteamento.
          # Vazio = a chave nem é renderizada.
          className: ""
          annotations:
            haproxy.org/ingress.class: haproxy
            haproxy.org/ssl-cert-namespace: platform
            haproxy.org/ssl-cert: litellm-tls
            # O default do HAProxy ingress é timeout-server 50s: resposta de LLM
            # não-streaming acima disso morre com 504.
            haproxy.org/timeout-server: "600s"
          hosts:
            - host: litellm.lan
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: litellm-tls
              hosts:
                - litellm.lan

        serviceMonitor:
          enabled: true
          # O Prometheus do cluster seleciona ServiceMonitor por
          # matchLabels release=kube-prometheus-stack (namespaceSelector {}),
          # então sem este label o target não é descoberto.
          labels:
            release: kube-prometheus-stack
          interval: 30s
          scrapeTimeout: 10s

        # extraResources é renderizado com toYaml SEM tpl -> YAML 100% estático,
        # sem {{ }}. O objeto abaixo é um hook PreSync, e não um recurso
        # normal, porque os recursos normais só existem na fase Sync — depois
        # do job de migrations do chart. O hook `litellm-db-bootstrap` que
        # existia aqui foi removido junto com o YugabyteDB: a role, o banco e
        # o schema `litellm` agora nascem com a instância PostgreSQL
        # (manifests/postgres/03-configmap-initdb.yaml).
        extraResources:
          # Certificado próprio do litellm.lan. O wildcard *.lan é rejeitado por
          # validadores (`.lan` é tratado como apex), então cada app .lan tem o
          # seu — mesmo padrão de headlamp/argocd/ceph/authentik. ClusterIssuer
          # local-ca = CA do mkcert.
          - apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: litellm-tls
              namespace: platform
            spec:
              secretName: litellm-tls
              issuerRef:
                name: local-ca
                kind: ClusterIssuer
              commonName: litellm.lan
              dnsNames:
                - litellm.lan

  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
