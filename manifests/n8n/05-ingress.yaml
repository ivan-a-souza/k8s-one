# Ingress do n8n em https://n8n.naesquina.com.br
#
# ⚠️ O backend é o SERVICE DO oauth2-proxy, e não o Service do n8n: o proxy faz
# o login OIDC contra o Authentik e só então encaminha para o n8n. O caminho
# /oauth2/* é tratado pelo próprio proxy.
#
# O cluster não tem IngressClass: roteia pela annotation
# haproxy.org/ingress.class, igual ao resto do repositório.
#
# Dois caminhos chegam aqui, no MESMO host (split-horizon):
#   - EXTERNO: navegador → Cloudflare (TLS) → tunnel k8s-one → cloudflared →
#     HAProxy:80 (HTTP) → este Ingress. O TLS público é o da Cloudflare.
#   - INTERNO: navegador da LAN/tailnet resolve o nome via AdGuard/CoreDNS para
#     o HAProxy:443 → este Ingress com o cert mkcert (n8n-tls).
#
# ⚠️ DNS: o AdGuard responde hosts por rewrite POR HOST (não wildcard) — é
# preciso o rewrite `n8n.naesquina.com.br -> 192.168.1.20`. Dentro do cluster, a
# linha de hosts do CoreDNS cobre.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  namespace: platform
  annotations:
    haproxy.org/ingress.class: haproxy
    haproxy.org/ssl-cert-namespace: platform
    haproxy.org/ssl-cert: n8n-tls
    # Workflows podem ter execuções/HTTP longos: folga no timeout.
    haproxy.org/timeout-server: "300s"
    haproxy.org/timeout-client: "300s"
spec:
  tls:
    - hosts:
        - n8n.naesquina.com.br
      secretName: n8n-tls
  rules:
    - host: n8n.naesquina.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 80
