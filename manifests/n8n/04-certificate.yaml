# Certificado do n8n.naesquina.com.br, emitido pelo ClusterIssuer `local-ca` (a
# CA do mkcert) — mesmo padrão de vault/argocd/headlamp/ceph/authentik/litellm/odoo.
# Certificado por host: o wildcard é rejeitado por validadores.
#
# O host é o DOMÍNIO PÚBLICO. Ele serve o TLS INTERNO (clientes da LAN/tailnet
# que batem em HAProxy:443 via split-horizon e confiam na CA do mkcert); no
# acesso PÚBLICO o TLS é terminado pela Cloudflare (cert dela na borda) e o
# trecho túnel→HAProxy é HTTP. O `ca.crt` deste Secret é montado no oauth2-proxy
# para ele validar o issuer (auth.naesquina.com.br, também mkcert) no discovery.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: n8n-tls
  namespace: platform
spec:
  secretName: n8n-tls
  issuerRef:
    name: local-ca
    kind: ClusterIssuer
  commonName: n8n.naesquina.com.br
  dnsNames:
    - n8n.naesquina.com.br
