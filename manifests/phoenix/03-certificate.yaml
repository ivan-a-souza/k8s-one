# Certificado do phoenix.lan, emitido pelo ClusterIssuer `local-ca` (a CA do
# mkcert) — mesmo padrão de argocd/headlamp/litellm/vaultwarden. Certificado por
# host (o wildcard *.lan é rejeitado por validadores).
#
# O `ca.crt` deste secret é o que o initContainer do Deployment concatena ao
# bundle da imagem, para o Phoenix validar o TLS do authentik.lan no OIDC.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: phoenix-tls
  namespace: platform
spec:
  secretName: phoenix-tls
  issuerRef:
    name: local-ca
    kind: ClusterIssuer
  commonName: phoenix.lan
  dnsNames:
    - phoenix.lan
