# Service do Phoenix. ClusterIP: quem consome é o LiteLLM (in-cluster) e o
# ingress para a UI. A porta 4317 (OTLP gRPC) fica exposta só internamente.
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: platform
  labels:
    app: phoenix
spec:
  selector:
    app: phoenix
  ports:
    - name: http
      port: 6006
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
